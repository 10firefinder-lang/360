<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="GOLD HOME & LIFE 360 – מערכת ניהול חיים אישית מקיפה" />
  <meta name="theme-color" content="#090909" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>GOLD HOME & LIFE 360</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg" />
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png" />

  <!-- Design System -->
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
  <link rel="stylesheet" href="/css/print.css" />
</head>
<body>
  <!-- App Shell -->
  <div id="app" class="app">
    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="sidebar" aria-label="ניווט ראשי">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon">◆</span>
          <div class="logo-text">
            <span class="logo-title">GOLD</span>
            <span class="logo-subtitle">HOME & LIFE 360</span>
          </div>
        </div>
        <button id="sidebar-toggle" class="btn-icon" aria-label="סגור תפריט">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <nav class="sidebar-nav" id="main-nav">
        <!-- Filled by router -->
      </nav>

      <div class="sidebar-footer">
        <button id="theme-toggle" class="btn-ghost" aria-label="החלף ערכת נושא">
          <span class="theme-icon">◐</span>
          <span class="theme-label">מצב כהה</span>
        </button>
        <div class="version">INFINITY · v0.1.0</div>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="main-wrapper">
      <!-- Top Bar -->
      <header class="topbar">
        <button id="menu-toggle" class="btn-icon mobile-only" aria-label="פתח תפריט">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12h18M3 6h18M3 18h18"/>
          </svg>
        </button>

        <div class="topbar-center">
          <div class="greeting" id="greeting">שלום</div>
          <div class="datetime datetime-bar" id="datetime-bar">
            <span class="dt-clock" id="clock">--:--</span>
            <span class="dt-sep">·</span>
            <span id="gregorian-date"></span>
            <span class="dt-sep" id="temp-sep" hidden>·</span>
            <span id="temp-badge" class="dt-holiday" hidden></span>
          </div>
        </div>

        <div class="topbar-actions">
          <button id="search-toggle" class="btn-icon" aria-label="חיפוש">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
            </svg>
          </button>
          <button id="notifications-btn" class="btn-icon" aria-label="התראות">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
            <span class="badge" id="notif-badge" hidden>0</span>
          </button>
          <button id="settings-btn" class="btn-icon" aria-label="הגדרות">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Page Content -->
      <main id="main-content" class="main-content" role="main">
        <!-- Dynamic content injected here -->
      </main>
    </div>
  </div>

  <!-- Global Modals / Overlays -->
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-container" aria-live="polite"></div>

  <!-- Core Scripts -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
